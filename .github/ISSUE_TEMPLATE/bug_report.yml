name: Bug report
description: 报告可以稳定复现的错误
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请删除日志中的密钥、公网地址和隐私音频信息。
  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已使用最新 master 复现
          required: true
        - label: 我已搜索现有 Issue，确认没有重复问题
          required: true
  - type: dropdown
    attributes:
      label: 问题范围
      options:
        - 安装或启动
        - Public API
        - Speaker Registry
        - TTS 推理
        - Web 工作台
        - Triton 高级接口
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 提供最小可复现命令或请求，敏感值请替换。
      placeholder: |
        1. 执行……
        2. 请求……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果与日志
      render: shell
    validations:
      required: true
  - type: input
    attributes:
      label: GPU
      placeholder: NVIDIA A100-SXM4-80GB
  - type: input
    attributes:
      label: NVIDIA Driver / Docker
      placeholder: Driver 550.127.08 / Docker 27.x
  - type: textarea
    attributes:
      label: 其他信息
      description: commit、浏览器、音频格式或其他相关上下文。
