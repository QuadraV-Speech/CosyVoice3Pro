name: Feature request
description: 提议一个清晰、可验证的新能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    attributes:
      label: 使用场景
      description: 先描述要解决的问题，而不是只描述实现方式。
      placeholder: 当……时，我希望……，因为……
    validations:
      required: true
  - type: textarea
    attributes:
      label: 建议方案
      description: 描述接口、交互或部署方式，以及是否影响现有兼容性。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 可接受的替代方案
  - type: checkboxes
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意提交 Pull Request
        - label: 我可以协助测试
