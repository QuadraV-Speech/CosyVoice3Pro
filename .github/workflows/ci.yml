name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lightweight test dependencies
        run: python -m pip install "requests>=2.31,<3"

      - name: Compile Python sources
        run: |
          python -m py_compile \
            gateway/app.py \
            gateway/legacy_tts.py \
            gateway/speaker_registration.py \
            gateway/tts_utils.py \
            scripts/client.py \
            scripts/benchmark.py

      - name: Check browser JavaScript
        run: node --check gateway/web/app.js

      - name: Check management shell
        run: bash -n manage.sh

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Enforce Web Public API boundary
        run: |
          if grep -En '/v2|/admin' gateway/web/app.js; then
            echo "Web console must only call the Public API" >&2
            exit 1
          fi
